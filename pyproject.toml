[project]
name = "sat-prep"
version = "0.1.0"
description = "A personalized SAT practice app built with Streamlit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["streamlit>=1.40"]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sat_prep"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
